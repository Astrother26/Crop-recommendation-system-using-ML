<!DOCTYPE html>
<html>
<head>
    <title>Fertilizer Recommendation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                        url('https://images.pexels.com/photos/55766/pexels-photo-55766.jpeg?cs=srgb&dl=pexels-pierre-sudre-9695-55766.jpg&fm=jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.4);
            padding: 2rem;
        }

        .navbar a {
            color: #333 !important;
            font-weight: 500;
            text-decoration: none;
        }
        
        .navbar a:hover {
            color: var(--primary-green) !important;
        }

        h1 {
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-label {
            color: #333;
            font-weight: 500;
        }

        .form-control {
            border: 1px solid #ddd;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(46, 204, 113, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-green);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--dark-green);
            transform: translateY(-2px);
        }

        .result-card {
            background-color: rgba(52, 73, 94, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 2rem;
            color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <nav class="flex justify-between items-center mb-8 navbar">
            <a href="/" class="text-xl font-bold" style="color: var(--primary-green);">🌱 FarmAssist</a>
            <div class="space-x-4">
                <a href="/crop" class="hover:text-primary-green">Crop Recommendation</a>
                <a href="/fertilizer" class="hover:text-primary-green">Fertilizer Recommendation</a>
            </div>
        </nav>

        <div class="main-container max-w-2xl mx-auto">
            <h1>Fertilizer Recommendation System 🌱</h1>
            
            <form action="{{ url_for('predict_fertilizer') }}" method="post" class="space-y-6">
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="form-label">Nitrogen (N)</label>
                        <input type="number" step="0.01" name="Nitrogen" required 
                               class="form-control w-full mt-1">
                    </div>
                    
                    <div>
                        <label class="form-label">Phosphorus (P)</label>
                        <input type="number" step="0.01" name="Phosphorus" required 
                               class="form-control w-full mt-1">
                    </div>
                    
                    <div>
                        <label class="form-label">Potassium (K)</label>
                        <input type="number" step="0.01" name="Potassium" required 
                               class="form-control w-full mt-1">
                    </div>
                </div>

                <div class="text-center mt-6">
                    <button type="submit" 
                            class="btn-primary">
                        Predict Fertilizer
                    </button>
                </div>
            </form>

            {% if result %}
            <div class="result-card text-center mt-8">
                <h2 class="text-lg font-semibold mb-2">Recommended Fertilizer:</h2>
                <p>{{ result }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
